openapi: 3.0.3
info:
  title: API Sistema de Entregas por Paracaídas
  version: 1.0.0
  description: Contrato REST para el sistema de encomiendas de caída libre.
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de desarrollo

tags:
  - name: Solicitudes
    description: Gestión de pedidos de encomiendas
  - name: Envíos
    description: Gestión del envío físico y contenedores
  - name: Bases
    description: Gestión de bases y stock de los remitentes

paths:
  # ==========================================
  # MÓDULO: SOLICITUDES
  # ==========================================
  /solicitudes:
    post:
      summary: Crear una nueva solicitud de envío
      description: El solicitante envía las coordenadas (formato GeoJSON) y los productos deseados. El sistema valida internamente si hay stock en alguna base antes de crearla.
      tags: [Solicitudes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitudRequest'
      responses:
        '201':
          description: Solicitud creada exitosamente (Hay stock disponible).
          headers:
            Location:
              schema: { type: string }
              description: URL de la solicitud creada
        '409':
          description: Rechazada. No hay stock suficiente en ninguna base para cumplir la solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /solicitudes/{id}:
    get:
      summary: Consultar el estado y detalle de una solicitud
      tags: [Solicitudes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle completo de la solicitud, incluyendo su envío físico y contenedor si ya fue asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /solicitudes/{id}/estado:
    patch:
      summary: Actualizar el estado general de la solicitud
      description: Utilizado por el Solicitante (para "Cancelada") o el sistema interno de gestión.
      tags: [Solicitudes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevoEstado]
              properties:
                nuevoEstado:
                  type: string
                  enum: [Pendiente, Aprobada, Cancelada, Completada, Anulada]
      responses:
        '200':
          description: Estado actualizado exitosamente.
        '422':
          description: Transición de estado inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================
  # MÓDULO: ENVÍOS FÍSICOS
  # ==========================================
  /envios/{id}:
    get:
      summary: Consultar el estado de un envío físico
      description: Retorna los datos operativos del envío y del contenedor asociado.
      tags: [Envíos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del envío físico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '404':
          description: Envío no encontrado.

  /envios/{id}/estado:
    patch:
      summary: Actualizar el estado físico de un envío
      description: Utilizado por los operarios o la telemetría del contenedor para reportar el progreso físico de la entrega.
      tags: [Envíos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevoEstado]
              properties:
                nuevoEstado:
                  type: string
                  enum: [En preparación, Listo para lanzamiento, En caída libre, Aterrizado, Recuperado]
      responses:
        '200':
          description: Estado del envío actualizado.
        '422':
          description: Transición de estado físico inválida.

  # ==========================================
  # MÓDULO: BASES Y STOCK
  # ==========================================
  /bases/{id}/stock:
    get:
      summary: Consultar el inventario de una base
      description: Utilizado por los Remitentes para ver qué productos tienen disponibles en su base.
      tags: [Bases]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de stock disponible
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockBase'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por Clerk.

  schemas:
    # --- Esquema de Error Estándar ---
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: STOCK_INSUFICIENTE
            message:
              type: string
              example: No hay inventario suficiente para los productos solicitados.
            details:
              type: string
              nullable: true

    # --- Objetos Geográficos (PostGIS / GeoJSON) ---
    GeoJSONPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          description: Arreglo de coordenadas [longitud, latitud]
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 2
          example: [-62.2663, -38.7183]

    # --- Esquemas de Dominio ---
    NuevaSolicitudRequest:
      type: object
      required: [ubicacionDestino, prioridad, productos]
      properties:
        ubicacionDestino:
          $ref: '#/components/schemas/GeoJSONPoint'
        prioridad:
          type: string
          enum: [Alta, Media, Baja]
        productos:
          type: array
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId:
                type: string
                format: uuid
              cantidad:
                type: integer
                minimum: 1

    Solicitud:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fechaSolicitada:
          type: string
          format: date-time
        estado:
          type: string
          example: Aprobada
        ubicacionDestino:
          $ref: '#/components/schemas/GeoJSONPoint'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleSolicitud'
        envioAsignado:
          $ref: '#/components/schemas/Envio'

    DetalleSolicitud:
      type: object
      properties:
        productoId:
          type: string
          format: uuid
        cantidadSolicitada:
          type: integer

    Envio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          format: uuid
        estadoFisico:
          type: string
          example: En caída libre
        baseOrigenId:
          type: string
          format: uuid
        contenedor:
          $ref: '#/components/schemas/Contenedor'
        fechaLanzamiento:
          type: string
          format: date-time
          nullable: true

    Contenedor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigoRastreo:
          type: string
        tipoParacaidas:
          type: string
          enum: [Estándar, Carga Pesada, Precisión GPS]
        estadoOperativo:
          type: string
          enum: [Disponible, Asignado, En recuperación, Mantenimiento]

    StockBase:
      type: object
      properties:
        productoId:
          type: string
          format: uuid
        nombre:
          type: string
        cantidadDisponible:
          type: integer
        cantidadReservada:
          type: integer